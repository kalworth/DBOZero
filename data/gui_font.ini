; GUI font config for pack/gui0.pak.
; Leave font empty to copy gui0.pak without changing font definitions.
; Run "python build_output.py --list-gui-fonts" to see available values.
; Copy one candidate key below into gui0.font, for example: font = SimHei.ttf

[gui0]
font = 
font_dir = E:\DBO Zero 2.0\DBOZero\font

[candidates]
DBOGBaseFont.ttf = face=DBOGBaseFont; family=DBOGBaseFont; full=DBOGBaseFont
DBOGBaseFontBold.ttf = face=DBOGBaseFontBold; family=DBOGBaseFontBold; full=DBOGBaseFontBold
DFU_HMD.TTF = face=DFPHeiMedium-UN; family=DFPHeiMedium-UN; full=DFPHeiMedium-UN
JhengHeiBold.ttf = face=JhengHei; family=JhengHei; full=JhengHeiBold
Lolita.ttf = face=Lolita; family=Lolita; full=Lolita
MSJHBD.TTF = face=Microsoft JhengHei; family=Microsoft JhengHei; full=Microsoft JhengHei Bold
SimHei.ttf = face=SimHei; family=SimHei; full=SimHei
